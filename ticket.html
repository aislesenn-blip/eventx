<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Pass - Smart Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fuchsia: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 min-h-screen text-white flex flex-col">

    <!-- Header -->
    <header class="p-6 flex items-center justify-between">
        <a href="javascript:history.back()" class="h-10 w-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-md">
            <i class="ph ph-arrow-left text-xl"></i>
        </a>
        <h1 class="text-lg font-bold" data-i18n="digital_pass">Digital Pass</h1>
        <button class="h-10 w-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-md">
            <i class="ph ph-share-network text-xl"></i>
        </button>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-6 pb-12">
        <!-- Ticket Card -->
        <div class="w-full max-w-sm bg-white rounded-[2rem] overflow-hidden shadow-2xl relative">
            <!-- Ticket Header Image -->
            <div class="h-32 w-full relative">
                <img src="https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&q=80&w=800" alt="Event Cover" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                <div class="absolute bottom-4 left-6">
                    <span class="inline-block px-2 py-1 bg-white/20 backdrop-blur-md rounded text-[10px] font-bold text-white mb-1 uppercase tracking-wider" data-i18n="filter_weddings">Wedding</span>
                    <h2 class="text-xl font-bold text-white leading-tight">Aisha & Ali</h2>
                </div>
            </div>

            <!-- Ticket Details -->
            <div class="p-6 bg-white relative">
                <!-- Golden Badge -->
                <div class="absolute top-4 right-4 bg-gradient-to-r from-[#bf953f] via-[#fcf6ba] to-[#b38728] px-3 py-1 rounded-full shadow-md z-10">
                    <span class="text-[10px] font-black text-slate-900 uppercase tracking-widest">Premium</span>
                </div>

                <!-- Perforation Line -->
                <div class="absolute -top-3 left-0 w-full flex justify-between items-center px-[-10px] pointer-events-none">
                    <div class="h-6 w-6 rounded-full bg-slate-900 -ml-3"></div>
                    <div class="border-t-2 border-dashed border-slate-200 flex-1 mx-2"></div>
                    <div class="h-6 w-6 rounded-full bg-slate-900 -mr-3"></div>
                </div>

                <div class="text-center mb-6 mt-2">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1" data-i18n="guest_name">Guest Name</p>
                    <h3 class="text-2xl font-black text-slate-800">John Doe</h3>
                    <p class="text-xs text-fuchsia-600 font-bold mt-1 bg-fuchsia-50 inline-block px-3 py-1 rounded-full border border-fuchsia-100">VIP ADMISSION</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase" data-i18n="date">Date</p>
                        <p class="text-sm font-bold text-slate-800">24 Oct, 2024</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase" data-i18n="time">Time</p>
                        <p class="text-sm font-bold text-slate-800">14:00 EAT</p>
                    </div>
                    <div class="col-span-2">
                        <p class="text-[10px] font-bold text-slate-400 uppercase" data-i18n="location">Location</p>
                        <p class="text-sm font-bold text-slate-800">Mlimani City Hall, Dar</p>
                    </div>
                </div>

                <!-- QR Code Area -->
                <div class="border-t border-slate-100 pt-6 flex flex-col items-center">
                    <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100 mb-2">
                        <!-- Simulated QR Code using Phosphor Icon -->
                        <i class="ph ph-qr-code text-[120px] text-slate-800"></i>
                    </div>
                    <p class="text-[10px] text-slate-400 text-center" data-i18n="scan_instruction">Show this code at the entrance</p>
                    <p class="text-xs font-mono font-bold text-slate-800 mt-2 tracking-widest">TKT-8924-VIP</p>
                </div>
            </div>
        </div>

        <button class="mt-8 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white font-bold py-3 px-8 rounded-full transition-colors flex items-center shadow-lg border border-white/10">
            <i class="ph ph-wallet mr-2 text-xl"></i>
            <span data-i18n="add_to_wallet">Add to Apple Wallet</span>
        </button>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Smart Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fuchsia: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800" data-i18n="my_events">My Events</h1>
            <div class="flex items-center space-x-3">
                <button onclick="toggleLanguage()" class="text-xs font-bold bg-white px-2 py-1 rounded border border-slate-200 text-slate-600 shadow-sm" data-i18n="lang_toggle">SW</button>
                <button class="h-8 w-8 rounded-full bg-fuchsia-100 text-fuchsia-600 flex items-center justify-center">
                    <i class="ph ph-plus font-bold"></i>
                </button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="px-6 pb-4">
            <div class="relative mb-4">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" data-i18n="search_events" placeholder="Search events..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent rounded-xl text-sm focus:border-fuchsia-500 focus:bg-white focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all">
            </div>
            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-hide">
                <button class="px-4 py-1.5 bg-fuchsia-600 text-white rounded-full text-xs font-medium whitespace-nowrap" data-i18n="filter_all">All</button>
                <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-medium whitespace-nowrap" data-i18n="filter_weddings">Weddings</button>
                <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-medium whitespace-nowrap" data-i18n="filter_sendoffs">Send-offs</button>
                <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-medium whitespace-nowrap" data-i18n="filter_birthdays">Birthdays</button>
            </div>
        </div>
    </header>

    <main class="px-6 py-6 space-y-5" id="events-container">
        <!-- Events will be rendered here by JS -->
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderBottomNav('events');
            if (typeof renderEventsList === 'function') {
                renderEventsList();
            }
        });
    </script>
</body>
</html>

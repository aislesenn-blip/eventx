<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event - Smart Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fuchsia: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="px-6 py-4 flex items-center justify-between max-w-3xl mx-auto">
            <div class="flex items-center">
                <a href="javascript:history.back()" class="mr-4 text-slate-500 hover:text-slate-800">
                    <i class="ph ph-arrow-left text-xl"></i>
                </a>
                <h1 class="text-xl font-bold text-slate-800" data-i18n="create_event">Create New Event</h1>
            </div>
        </div>
    </header>

    <main class="px-6 py-6 space-y-6 max-w-3xl mx-auto pb-24">
        <form class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="event_name">Event Name</label>
                <input type="text" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm" placeholder="e.g. Annual Tech Conference">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="event_type">Event Type</label>
                <select class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm text-slate-600">
                    <option value="weddings" data-i18n="filter_weddings">Wedding</option>
                    <option value="birthdays" data-i18n="filter_birthdays">Birthday</option>
                    <option value="sendoffs" data-i18n="filter_sendoffs">Send-off</option>
                    <option value="conferences" data-i18n="filter_conferences">Conference</option>
                    <option value="fundraising" data-i18n="filter_fundraising">Fundraising</option>
                    <option value="other" data-i18n="filter_other">Other (Custom)</option>
                </select>
            </div>

            <div id="custom-type-container" class="hidden">
                <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="custom_type">Custom Event Type</label>
                <input type="text" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm" placeholder="Specify your event type">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="date">Date</label>
                    <input type="date" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm text-slate-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="time">Time</label>
                    <input type="time" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm text-slate-600">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="location">Location</label>
                <input type="text" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none transition-all shadow-sm" placeholder="Venue name or address">
            </div>

            <div>
                 <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="cover_photo">Cover Photo</label>
                 <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer">
                     <i class="ph ph-image text-3xl text-slate-400 mb-2"></i>
                     <span class="text-xs text-slate-500 font-medium" data-i18n="upload_image">Tap to upload image</span>
                 </div>
            </div>

            <div class="pt-4">
                <button type="button" onclick="history.back()" class="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-fuchsia-200 transition-all active:scale-95" data-i18n="save_event">
                    Create Event
                </button>
            </div>
        </form>
    </main>

    <script src="js/i18n.js"></script>
    <!-- Driver.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Mini tour for Add Event page
            initPageTour('add_event', [
                { element: 'select', popover: { title: 'Custom Types', description: 'Choose "Other" to create a completely custom event.', side: "bottom", align: 'start' }},
                { element: '.border-dashed', popover: { title: 'Cover Photo', description: 'Upload a beautiful cover image for your event here.', side: "top", align: 'center' }}
            ]);

            const select = document.querySelector('select');
            const customTypeContainer = document.getElementById('custom-type-container');

            select.addEventListener('change', (e) => {
                if(e.target.value === 'other') {
                    customTypeContainer.classList.remove('hidden');
                } else {
                    customTypeContainer.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michango - Smart Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fuchsia: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header Area with gradient -->
    <div class="bg-gradient-to-br from-fuchsia-600 to-purple-700 pt-8 pb-20 px-6 rounded-b-[40px] text-white">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold" data-i18n="contributions">Michango</h1>
            <button onclick="toggleLanguage()" class="text-xs font-bold bg-white/20 px-2 py-1 rounded border border-white/40 text-white shadow-sm" data-i18n="lang_toggle">SW</button>
        </div>

        <div class="text-center">
            <p class="text-sm text-fuchsia-100 mb-1" data-i18n="total_collected">Total Collected</p>
            <h2 class="text-4xl font-bold mb-4">TZS 4.5M</h2>

            <div class="w-full bg-white/20 rounded-full h-2 mb-2">
                <div class="bg-white h-2 rounded-full" style="width: 45%"></div>
            </div>
            <p class="text-[10px] text-fuchsia-100"><span data-i18n="target">Target</span>: TZS 10M (45%)</p>
        </div>
    </div>

    <main class="px-6 -mt-12 space-y-6">
        <!-- Add Payment Action -->
        <button onclick="openPaymentModal()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg hover-lift flex items-center justify-center mb-6">
            <i class="ph ph-wallet text-xl mr-2"></i>
            <span data-i18n="simulate_payment">Simulate Payment</span>
        </button>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover-lift">
                <div class="h-8 w-8 rounded-full bg-emerald-50 flex items-center justify-center mb-2 text-emerald-500">
                    <i class="ph ph-arrow-down-left"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-medium" data-i18n="paid">Paid</p>
                <h3 class="text-lg font-bold text-slate-800">4.5M</h3>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover-lift">
                <div class="h-8 w-8 rounded-full bg-amber-50 flex items-center justify-center mb-2 text-amber-500">
                    <i class="ph ph-arrow-up-right"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-medium" data-i18n="pledges">Pledges</p>
                <h3 class="text-lg font-bold text-slate-800">1.2M</h3>
            </div>
        </div>

        <!-- Transactions -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800" data-i18n="recent_transactions">Recent Transactions</h3>
                <button class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <i class="ph ph-funnel"></i>
                </button>
            </div>

            <div class="relative mb-4">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" data-i18n="search_contributor" placeholder="Search contributor..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 outline-none">
            </div>

            <div class="space-y-3">
                <!-- Transaction Item -->
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center mr-3 text-sm">
                            A
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">Aisha Juma</p>
                            <p class="text-[10px] text-slate-500">Today, 10:23 AM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 500,000</p>
                        <span class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded text-[9px] font-bold mt-1" data-i18n="status_paid">PAID</span>
                    </div>
                </div>

                <!-- Transaction Item -->
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-amber-100 text-amber-600 font-bold flex items-center justify-center mr-3 text-sm">
                            J
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">John Doe</p>
                            <p class="text-[10px] text-slate-500">Yesterday, 14:05 PM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 200,000</p>
                        <span class="inline-block px-2 py-0.5 bg-amber-50 text-amber-600 rounded text-[9px] font-bold mt-1" data-i18n="pledged">PLEDGED</span>
                    </div>
                </div>

                 <!-- Transaction Item -->
                 <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center mr-3 text-sm">
                            M
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">Mary Mushi</p>
                            <p class="text-[10px] text-slate-500">12 Oct, 09:10 AM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 1,000,000</p>
                        <span class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded text-[9px] font-bold mt-1" data-i18n="status_paid">PAID</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Payment Simulation Modal -->
    <div id="payment-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closePaymentModal()"></div>
        <div class="absolute bottom-0 left-0 w-full bg-white rounded-t-3xl p-6 transform transition-transform translate-y-full" id="payment-modal-content">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>

            <h3 class="text-xl font-bold text-slate-800 mb-6 text-center" data-i18n="simulate_payment">Simulate Payment</h3>

            <form class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="payment_method">Payment Method</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-500 transition-colors">
                            <input type="radio" name="method" class="hidden" checked>
                            <i class="ph ph-device-mobile text-2xl text-emerald-500 mb-1"></i>
                            <span class="text-xs font-bold text-slate-600 text-center" data-i18n="mobile_money">Mobile Money</span>
                        </label>
                        <label class="border border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition-colors">
                            <input type="radio" name="method" class="hidden">
                            <i class="ph ph-bank text-2xl text-blue-500 mb-1"></i>
                            <span class="text-xs font-bold text-slate-600 text-center" data-i18n="bank_transfer">Bank Transfer</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="amount">Amount (TZS)</label>
                    <input type="number" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none" value="50000">
                </div>
            </form>

            <button onclick="processPayment()" class="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-200 flex items-center justify-center transition-transform active:scale-95">
                <i class="ph ph-check-circle text-xl mr-2"></i>
                <span data-i18n="pay_now">Pay Now</span>
            </button>
        </div>
    </div>

    <style>
        .modal-open #payment-modal-content {
            transform: translateY(0);
        }
    </style>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderBottomNav('michango');
        });

        function openPaymentModal() {
            const modal = document.getElementById('payment-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('modal-open');
            }, 10);
        }

        function closePaymentModal() {
            const modal = document.getElementById('payment-modal');
            modal.classList.remove('modal-open');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function processPayment() {
            const btn = document.querySelector('#payment-modal button[onclick="processPayment()"]');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl mr-2"></i> Processing...';

            setTimeout(() => {
                closePaymentModal();
                btn.innerHTML = '<i class="ph ph-check-circle text-xl mr-2"></i> <span data-i18n="pay_now">Pay Now</span>';
                if(typeof applyTranslations === 'function') applyTranslations();

                // Show simple alert for demo
                setTimeout(() => {
                    alert("Payment processed successfully! (Demo)");
                }, 400);
            }, 1500);
        }
    </script>
</body>
</html>

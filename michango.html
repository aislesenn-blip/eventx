<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michango - Smart Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fuchsia: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header Area with gradient -->
    <div class="bg-gradient-to-br from-fuchsia-600 to-purple-700 pt-8 pb-20 px-6 rounded-b-[40px] text-white">
        <h1 class="text-2xl font-bold mb-8">Michango</h1>

        <div class="text-center">
            <p class="text-sm text-fuchsia-100 mb-1">Total Collected</p>
            <h2 class="text-4xl font-bold mb-4">TZS 4.5M</h2>

            <div class="w-full bg-white/20 rounded-full h-2 mb-2">
                <div class="bg-white h-2 rounded-full" style="width: 45%"></div>
            </div>
            <p class="text-[10px] text-fuchsia-100">Target: TZS 10M (45%)</p>
        </div>
    </div>

    <main class="px-6 -mt-12 space-y-6">
        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover-lift">
                <div class="h-8 w-8 rounded-full bg-emerald-50 flex items-center justify-center mb-2 text-emerald-500">
                    <i class="ph ph-arrow-down-left"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-medium">Paid</p>
                <h3 class="text-lg font-bold text-slate-800">4.5M</h3>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover-lift">
                <div class="h-8 w-8 rounded-full bg-amber-50 flex items-center justify-center mb-2 text-amber-500">
                    <i class="ph ph-arrow-up-right"></i>
                </div>
                <p class="text-[10px] text-slate-500 font-medium">Pledges</p>
                <h3 class="text-lg font-bold text-slate-800">1.2M</h3>
            </div>
        </div>

        <!-- Transactions -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800">Recent Transactions</h3>
                <button class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <i class="ph ph-funnel"></i>
                </button>
            </div>

            <div class="relative mb-4">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search contributor..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 outline-none">
            </div>

            <div class="space-y-3">
                <!-- Transaction Item -->
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center mr-3 text-sm">
                            A
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">Aisha Juma</p>
                            <p class="text-[10px] text-slate-500">Today, 10:23 AM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 500,000</p>
                        <span class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded text-[9px] font-bold mt-1">PAID</span>
                    </div>
                </div>

                <!-- Transaction Item -->
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-amber-100 text-amber-600 font-bold flex items-center justify-center mr-3 text-sm">
                            J
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">John Doe</p>
                            <p class="text-[10px] text-slate-500">Yesterday, 14:05 PM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 200,000</p>
                        <span class="inline-block px-2 py-0.5 bg-amber-50 text-amber-600 rounded text-[9px] font-bold mt-1">PLEDGED</span>
                    </div>
                </div>

                 <!-- Transaction Item -->
                 <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center mr-3 text-sm">
                            M
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">Mary Mushi</p>
                            <p class="text-[10px] text-slate-500">12 Oct, 09:10 AM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800">TZS 1,000,000</p>
                        <span class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded text-[9px] font-bold mt-1">PAID</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderBottomNav('michango');
        });
    </script>
</body>
</html>
